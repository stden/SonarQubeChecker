[package]
name = "sonarqube_checker"
version = "0.1.0"
edition = "2021"
authors = ["Denis Stepulenok <Denis.Stepulenok@kuehne-nagel.com>"]
description = "A tool to fetch project analysis data and issues from SonarQube"

[dependencies]
reqwest = { version = "0.13", features = ["blocking", "json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.6", features = ["derive", "env"] }
chrono = "0.4"
dotenv = "0.15"
base64 = "0.23"
anyhow = "1.0"
once_cell = "1.21"

[dev-dependencies]
mockito = "1.7"
tempfile = "3.27"
# === Build size optimization (applied automatically 2026-04-11) ===
# strip = "debuginfo" removes heavy DWARF sections (~98% target size reduction)
# debug = 1 keeps file:line in backtraces but no variable info
[profile.dev]
debug = 1
strip = "debuginfo"

