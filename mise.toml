[tools]
python = "3.11"
rust = "1.99.1"
uv = "0.13.7"

[tasks.test]
run = [
    "python -m pip install --upgrade pip setuptools wheel",
    "pip install -e '.[dev]'",
    "pytest -v --tb=short",
]

[tasks.check]
run = "git diff --check"

[tasks."rust:check"]
run = "cargo check"

[tasks."rust:test"]
run = "cargo test"

[tasks.build]
run = "cargo build"
